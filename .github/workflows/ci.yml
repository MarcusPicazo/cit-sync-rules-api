name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CitSync.Rules.slnx

      - name: Build
        run: dotnet build CitSync.Rules.slnx --no-restore --configuration Release

      # Integration tests start SQL Server through Testcontainers; Docker is preinstalled on ubuntu-latest.
      - name: Test
        run: >
          dotnet test CitSync.Rules.slnx --no-build --configuration Release
          --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
